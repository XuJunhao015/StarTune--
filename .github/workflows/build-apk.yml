name: Inspect StarTune Android Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check ZIP archive
        run: |
          echo "Checking project archive..."
          ls -lah
          echo "Searching for ZIP archives..."
          find . -maxdepth 2 -type f -iname '*.zip' -print
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -n "$ZIP_FILE" ]; then
            echo "Found archive: $ZIP_FILE"
            unzip -l "$ZIP_FILE"
          else
            echo "No ZIP archive found in repository."
            find . -maxdepth 3 -type f
            exit 1
          fi
