name: Build StarTune APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          ls -la
          unzip -l StarTuneAndroid_source.zip

      - name: Stop until project structure is verified
        run: |
          echo "Archive uploaded. Need to verify its contents before compiling."
          exit 1
