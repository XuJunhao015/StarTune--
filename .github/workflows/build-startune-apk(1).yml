name: Build StarTune APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check source archive
        run: test -f StarTuneAndroid_source.zip

      - name: Extract Android project
        run: unzip -q StarTuneAndroid_source.zip

      - name: Build debug APK
        working-directory: StarTuneAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StarTune-debug-apk
          path: StarTuneAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
